<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rocket Flight Replay 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; background:#0a0e14; }
  #app { position:relative; width:100%; height:100vh; color:#e8e8e8; }
  #scene { position:absolute; top:0; left:0; width:100%; height:100%; cursor:grab; }
  #scene:active { cursor:grabbing; }
  #hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
  .panel { position:absolute; background:rgba(8,12,16,0.78); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:12px 16px; pointer-events:auto; backdrop-filter:blur(3px); }

  #stateBox { top:16px; left:16px; width:210px; }
  #stateLabel { font-size:11px; letter-spacing:1px; color:#9aa; text-transform:uppercase; margin-bottom:4px; }
  #stateValue { font-size:20px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  #telemetryBox { top:92px; left:16px; width:210px; }
  .telRow { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.07); }
  .telRow:last-child { border-bottom:none; }
  .telLabel { color:#9aa; }
  .telVal { font-weight:600; }
  .telUnit { color:#789; font-size:11px; margin-left:3px; font-weight:400; }

  #summaryBox { bottom:170px; left:16px; width:210px; }
  .sumRow { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; }
  .sumLabel { color:#9aa; }
  .sumVal { font-weight:600; }

  #tPlusBox { top:16px; right:16px; text-align:right; font-size:22px; font-weight:600; font-variant-numeric: tabular-nums; }
  #titleBox { position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#9aa; }

  #chartBox { position:absolute; right:16px; bottom:80px; width:340px; height:150px; background:rgba(8,12,16,0.78); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:8px 12px; pointer-events:auto; }

  #timeline { position:absolute; bottom:16px; left:16px; right:16px; display:flex; align-items:center; gap:12px; pointer-events:auto; z-index:11; }
  #timeline button { background:rgba(20,26,32,0.9); border:1px solid rgba(255,255,255,0.18); color:#e8e8e8; border-radius:5px; padding:8px 14px; font-size:13px; cursor:pointer; font-weight:600; }
  #timeline button:hover { background:rgba(40,50,60,0.95); }
  #timeline button.active { background:#1d9e75; border-color:#1d9e75; }
  #windDownBtn, #windUpBtn { padding:8px 10px; font-size:12px; }
  #scrubber { flex:1; }
  #scrubber input[type=range] { width:100%; }

  #hint { position:absolute; bottom:70px; left:50%; transform:translateX(-50%); font-size:11px; color:#678; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div id="hud">
    <div id="titleBox">Simulação de voo — dados reais do RocketPy</div>

    <div class="panel" id="stateBox">
      <div id="stateLabel">Flight state</div>
      <div id="stateValue"><span class="dot"></span><span id="stateText">-</span></div>
    </div>

    <div class="panel" id="telemetryBox">
      <div class="telRow"><span class="telLabel">Altitude</span><span class="telVal" id="telAlt">0<span class="telUnit">m</span></span></div>
      <div class="telRow"><span class="telLabel">Speed</span><span class="telVal" id="telSpeed">0<span class="telUnit">m/s</span></span></div>
      <div class="telRow"><span class="telLabel">Vert. speed</span><span class="telVal" id="telVspeed">0<span class="telUnit">m/s</span></span></div>
      <div class="telRow"><span class="telLabel">Accel</span><span class="telVal" id="telAccel">0<span class="telUnit">g</span></span></div>
    </div>

    <div class="panel" id="summaryBox">
      <div id="stateLabel" style="margin-bottom:8px;">Flight summary</div>
      <div class="sumRow"><span class="sumLabel">Apogee</span><span class="sumVal" id="sumApogee">-</span></div>
      <div class="sumRow"><span class="sumLabel">Max speed</span><span class="sumVal" id="sumMaxSpeed">-</span></div>
      <div class="sumRow"><span class="sumLabel">Max accel</span><span class="sumVal" id="sumMaxAccel">-</span></div>
    </div>

    <div class="panel" id="tPlusBox">T+ <span id="tplus">0.0</span> s</div>

    <div id="chartBox"><canvas id="altChart"></canvas></div>
    <div id="hint">Arraste para orbitar &middot; scroll para zoom</div>

    <div id="timeline">
      <button id="playBtn">Play</button>
      <button id="followBtn" class="active">Follow</button>
      <div id="scrubber"><input type="range" id="scrubRange" min="0" max="1000" value="0"></div>
      <button id="windDownBtn" title="Diminuir vento">Vento -</button>
      <span id="windLabel" style="font-size:12px; color:#9aa; min-width:60px; text-align:center;">Vento 1.0x</span>
      <button id="windUpBtn" title="Aumentar vento">Vento +</button>
    </div>
  </div>
</div>

  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, lineMat);
  chuteGroup.add(line);
  shroudLines.push({ line, rx, rz });
}
chuteGroup.visible = false;
scene.add(chuteGroup);

const deployIdx = flight.findIndex(p => p.state === 'descent');
let chuteScale = 0;

// halo abaixo do foguete pra facilitar achar ele visualmente
const haloGeo = new THREE.RingGeometry(4,5,24);
const haloMat = new THREE.MeshBasicMaterial({ color:0x1d9e75, side:THREE.DoubleSide, transparent:true, opacity:0.8 });
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.rotation.x = -Math.PI/2;
scene.add(halo);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- 3. ORBIT MANUAL (sem dependências extras) ----------
let camDist = 220, camTheta = 0.9, camPhi = 1.0, camTarget = new THREE.Vector3(flight[0].x,50,flight[0].z);
let dragging = false, lastX=0, lastY=0;
container.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; follow=false; document.getElementById('followBtn').classList.remove('active'); });
window.addEventListener('pointerup', ()=> dragging=false);
window.addEventListener('pointermove', e=>{
  if(!dragging) return;
  camTheta -= (e.clientX-lastX)*0.005;
  camPhi = Math.max(0.15, Math.min(1.5, camPhi - (e.clientY-lastY)*0.005));
  lastX=e.clientX; lastY=e.clientY;
});
container.addEventListener('wheel', e=>{
  camDist = Math.max(30, Math.min(1500, camDist + e.deltaY*0.4));
  e.preventDefault();
}, { passive:false });

function updateCamera(targetPos) {
  camTarget.lerp(targetPos, 0.15);
  const x = camTarget.x + camDist*Math.sin(camPhi)*Math.sin(camTheta);
  const y = camTarget.y + camDist*Math.cos(camPhi);
  const z = camTarget.z + camDist*Math.sin(camPhi)*Math.cos(camTheta);
  camera.position.set(x,y,z);
  camera.lookAt(camTarget);
}

// ---------- 4. GRÁFICO DE ALTITUDE ----------
const ctx = document.getElementById('altChart').getContext('2d');
const altChart = new Chart(ctx, {
  type:'line',
  data: { labels: flight.map(p=>p.t.toFixed(0)),
    datasets: [{ data: flight.map(p=>p.y), borderColor:'#378add', backgroundColor:'rgba(55,138,221,0.15)', borderWidth:1.5, pointRadius:0, fill:true, tension:0.2 }] },
  options: { responsive:true, maintainAspectRatio:false, animation:false, plugins:{legend:{display:false}},
    scales:{ x:{ ticks:{color:'#789', maxTicksLimit:6, font:{size:10}}, grid:{color:'rgba(255,255,255,0.05)'} },
             y:{ ticks:{color:'#789', font:{size:10}}, grid:{color:'rgba(255,255,255,0.05)'} } } }
});
Chart.register({ id:'cursor', afterDraw(chart){
  const idx = chart._cursorIdx; if(idx==null) return;
  const x = chart.scales.x.getPixelForValue(idx); const {top,bottom} = chart.chartArea; const c = chart.ctx;
  c.save(); c.strokeStyle='#e8b84b'; c.lineWidth=1.5; c.beginPath(); c.moveTo(x,top); c.lineTo(x,bottom); c.stroke(); c.restore();
}});

// ---------- 5. PLAYBACK ----------
let idx = 0, playing = false, follow = true;
const range = document.getElementById('scrubRange');
range.max = flight.length - 1;

const stateColors = { armed:'#eab308', boost:'#e24b4a', coast:'#378add', descent:'#1d9e75', landed:'#888' };
const stateLabels = { armed:'Armed', boost:'Boost', coast:'Coast', descent:'Descent', landed:'Landed' };

// objetos reutilizáveis (evita alocação por frame = evita queda de FPS)
const _dir = new THREE.Vector3();
const _up = new THREE.Vector3(0,1,0);
const _velQuat = new THREE.Quaternion();
const _hangEuler = new THREE.Euler();
const _hangQuat = new THREE.Quaternion();
let windSpeedMult = 1.0;
let lastChartIdx = -999;

function render() {
  const p = flight[idx];
  document.getElementById('tplus').textContent = (p.t >= 0 ? '+' : '') + p.t.toFixed(1);
  document.getElementById('telAlt').innerHTML = p.y.toFixed(0) + '<span class="telUnit">m</span>';
  document.getElementById('telSpeed').innerHTML = p.speed.toFixed(0) + '<span class="telUnit">m/s</span>';
  document.getElementById('telVspeed').innerHTML = p.vSpeed.toFixed(0) + '<span class="telUnit">m/s</span>';
  document.getElementById('telAccel').innerHTML = p.accel.toFixed(1) + '<span class="telUnit">g</span>';
  document.getElementById('stateText').textContent = stateLabels[p.state] || p.state;
  document.querySelector('#stateValue .dot').style.background = stateColors[p.state] || '#888';
  document.getElementById('stateText').style.color = stateColors[p.state] || '#888';

  rocketGroup.position.set(p.x, p.y, p.z);
  halo.position.set(p.x, 0.6, p.z);

  // animação do paraquedas: abre logo após o deploy, some quando pousa
  const wantOpen = deployIdx >= 0 && idx > deployIdx && p.state !== 'landed';
  const targetScale = wantOpen ? 1 : 0;
  chuteScale += (targetScale - chuteScale) * 0.15;
  chuteGroup.visible = chuteScale > 0.01;
  chuteGroup.scale.set(chuteScale, chuteScale, chuteScale);

  // balanço de vento: o paraquedas (e o foguete pendurado nele) oscilam continuamente
  const windTime = performance.now() * 0.0016 * windSpeedMult;
  const swayZ = Math.sin(windTime) * 0.16 * chuteScale;
  const swayX = Math.cos(windTime * 0.7) * 0.1 * chuteScale;
  const driftX = Math.sin(windTime * 0.5) * 3.5 * chuteScale;
  const driftZ = Math.cos(windTime * 0.4) * 2 * chuteScale;
  chuteGroup.rotation.set(swayX, 0, swayZ);
  chuteGroup.position.set(p.x + driftX, p.y, p.z + driftZ);

  // orientação do foguete: alinhado com a velocidade durante o voo propulsado,
  // mas muda de ângulo (pendurado, "de ponta cabeça") assim que o paraquedas abre
  const next = flight[Math.min(idx+1, flight.length-1)];
  _dir.set(next.x-p.x, next.y-p.y, next.z-p.z);
  if (_dir.lengthSq() > 0.0001) {
    _velQuat.setFromUnitVectors(_up, _dir.normalize());
  }
  _hangEuler.set(swayX*2.5, 0, swayZ*2.5);
  _hangQuat.setFromEuler(_hangEuler);
  const targetQuat = wantOpen ? _hangQuat : _velQuat;
  rocketGroup.quaternion.slerp(targetQuat, wantOpen ? 0.1 : 0.3);

  range.value = idx;

  // gráfico redesenha só a cada poucos passos (evita travar o FPS)
  if (Math.abs(idx - lastChartIdx) >= 4 || idx === 0 || idx === flight.length-1) {
    altChart._cursorIdx = idx;
    altChart.update('none');
    lastChartIdx = idx;
  }
}
render();

let lastFrame = 0;
const _targetPos = new THREE.Vector3();
function animate(ts) {
  if (playing) {
    if (!lastFrame) lastFrame = ts;
    if (ts - lastFrame > 30) {
      idx = Math.min(idx + 2, flight.length - 1);
      render();
      lastFrame = ts;
      if (idx >= flight.length - 1) { playing = false; document.getElementById('playBtn').textContent = 'Play'; }
    }
  } else if (chuteScale > 0.01) {
    // continua o balanço do paraquedas mesmo pausado, sem redesenhar o gráfico
    const p = flight[idx];
    const windTime = performance.now() * 0.0016 * windSpeedMult;
    const swayZ = Math.sin(windTime) * 0.16 * chuteScale;
    const swayX = Math.cos(windTime * 0.7) * 0.1 * chuteScale;
    const driftX = Math.sin(windTime * 0.5) * 3.5 * chuteScale;
    const driftZ = Math.cos(windTime * 0.4) * 2 * chuteScale;
    chuteGroup.rotation.set(swayX, 0, swayZ);
    chuteGroup.position.set(p.x + driftX, p.y, p.z + driftZ);
    _hangEuler.set(swayX*2.5, 0, swayZ*2.5);
    _hangQuat.setFromEuler(_hangEuler);
    rocketGroup.quaternion.slerp(_hangQuat, 0.1);
  }
  const p = flight[idx];
  _targetPos.set(p.x, p.y, p.z);
  if (follow) camTarget.copy(_targetPos);
  updateCamera(follow ? _targetPos : camTarget);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

document.getElementById('playBtn').onclick = () => {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
};
document.getElementById('followBtn').onclick = (e) => {
  follow = !follow;
  e.target.classList.toggle('active', follow);
};
document.getElementById('windUpBtn').onclick = () => {
  windSpeedMult = Math.min(4, Math.round((windSpeedMult + 0.5)*10)/10);
  document.getElementById('windLabel').textContent = 'Vento ' + windSpeedMult.toFixed(1) + 'x';
};
document.getElementById('windDownBtn').onclick = () => {
  windSpeedMult = Math.max(0, Math.round((windSpeedMult - 0.5)*10)/10);
  document.getElementById('windLabel').textContent = 'Vento ' + windSpeedMult.toFixed(1) + 'x';
};
range.oninput = (e) => { idx = parseInt(e.target.value); playing = false; document.getElementById('playBtn').textContent = 'Play'; render(); };

document.getElementById('sumApogee').textContent = summary.apogee + ' m @ T+' + summary.apogeeT + 's';
document.getElementById('sumMaxSpeed').textContent = summary.maxSpeed + ' m/s';
document.getElementById('sumMaxAccel').textContent = summary.maxAccel + ' g';
</script>
</body>
</html>
